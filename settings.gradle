pluginManagement {
    repositories {
        gradlePluginPortal()
        maven { url = 'https://maven.neoforged.net/releases' }
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = "extendedsignals"

include 'common'

file('contentpacks').eachDir { dir ->
    include dir.name
    project(":${dir.name}").projectDir = dir
}