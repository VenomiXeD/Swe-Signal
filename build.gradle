import java.time.Instant

plugins {
    id 'java-library'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.1.36' apply false
}

subprojects {
    apply plugin: 'java-library'
    apply plugin: 'maven-publish'
    apply plugin: 'net.neoforged.gradle.userdev'

    java.toolchain.languageVersion = JavaLanguageVersion.of(21)

    tasks.withType(Copy.class).configureEach {
        duplicatesStrategy = DuplicatesStrategy.EXCLUDE
    }

    tasks.withType(ProcessResources).configureEach {
        var replaceProperties = [
                minecraft_version      : minecraft_version,
                minecraft_version_range: minecraft_version_range,
                neo_version            : neo_version,
                loader_version_range   : loader_version_range,
                mod_id                 : mod_id,
                mod_name               : mod_name,
                mod_license            : mod_license,
                mod_version            : mod_version,
        ]
        inputs.properties replaceProperties

        filesMatching(['META-INF/neoforge.mods.toml']) {
            expand replaceProperties
        }
    }

    repositories {
        mavenCentral()
        maven { url = "https://maven.createmod.net" } // Create, Ponder, Flywheel
        maven { url = "https://maven.ithundxr.dev/snapshots" } // Registrate
        maven {
            url "https://cursemaven.com"
            content {
                includeGroup "curse.maven"
            }
        }
    }

    dependencies {
        implementation "net.neoforged:neoforge:${rootProject.neo_version}"

        implementation("com.simibubi.create:create-${minecraft_version}:${create_version}:slim") { transitive = false }
        implementation("net.createmod.ponder:ponder-neoforge:${ponder_version}+mc${minecraft_version}")
        compileOnly("dev.engine-room.flywheel:flywheel-neoforge-api-${minecraft_version}:${flywheel_version}")
        runtimeOnly("dev.engine-room.flywheel:flywheel-neoforge-${minecraft_version}:${flywheel_version}")
        implementation("com.tterrag.registrate:Registrate:${registrate_version}")

        implementation "curse.maven:jei-238222:7420587"

        compileOnly("org.projectlombok:lombok:1.18.46")
        annotationProcessor("org.projectlombok:lombok:1.18.46")

        testCompileOnly("org.projectlombok:lombok:1.18.46")
        testAnnotationProcessor("org.projectlombok:lombok:1.18.46")

        // Source: https://mvnrepository.com/artifact/org.junit.jupiter/junit-jupiter-api
        testImplementation platform('org.junit:junit-bom:5.10.2')
        testImplementation 'org.junit.jupiter:junit-jupiter'

        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    tasks.withType(Test).configureEach {
        useJUnitPlatform()
    }

    runs {
        // applies to all the run configs below
        configureEach {
            // Recommended logging data for a userdev environment
            // The markers can be added/remove as needed separated by commas.
            // "SCAN": For mods scan.
            // "REGISTRIES": For firing of registry events.
            // "REGISTRYDUMP": For getting the contents of all registries.
            systemProperty 'forge.logging.markers', 'REGISTRIES'

            // Recommended logging level for the console
            // You can set various levels here.
            // Please read: https://stackoverflow.com/questions/2031163/when-to-use-the-different-log-levels
            systemProperty 'forge.logging.console.level', 'debug'

            // workingDirectory project.layout.projectDirectory.dir('run').dir(name)

            modSource project.sourceSets.main
        }

        client {
            // Comma-separated list of namespaces to load gametests from. Empty = all namespaces.
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id

            workingDirectory = rootProject.file("runs/${project.name}/client")
        }

        server {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
            argument '--nogui'

            workingDirectory = rootProject.file("runs/${project.name}/server")
        }

        // This run config launches GameTestServer and runs all registered gametests, then exits.
        // By default, the server will crash when no gametests are provided.
        // The gametest system is also enabled by default for other run configs under the /test command.
        gameTestServer {
            systemProperty 'neoforge.enabledGameTestNamespaces', project.mod_id
        }

        data {
            // example of overriding the workingDirectory set in configureEach above, uncomment if you want to use it
            // workingDirectory project.file('run-data')

            arguments.addAll([
                    '--mod', project.mod_sub_id == "common" ? "extended_signals" : "extended_signals_" + project.mod_sub_id,
                    '--all',
                    '--output', file('src/generated/resources/').absolutePath,
                    '--existing', file('src/main/resources/').absolutePath
            ])

            workingDirectory = rootProject.file("runs/${project.name}/data")
        }
    }


    sourceSets.main.resources {
        // Include resources generated by data generators.
        srcDir('src/generated/resources')

        // Exclude common development only resources from finalized outputs
        exclude("**/*.bbmodel") // BlockBench project files
        exclude("src/generated/**/.cache") // datagen cache files
    }

    def gitHash = providers.exec {
        commandLine("git", "rev-parse", "--short", "HEAD")
    }.standardOutput.asText.map { it.trim() }

    tasks.withType(Jar).configureEach {
        archiveVersion.set("${project.version}-git-${gitHash.get()}-t${Instant.now().toString().replace(':', '-')}-${minecraft_version}")
    }

    base.archivesName = "extended-signals-${project.name}"
}

tasks.register("copyAllJars", Copy) {
    dependsOn subprojects.collect { sub ->
        sub.tasks.matching { task ->
            task.name.toLowerCase().contains("jar")
        }
    }

    from(subprojects.collect { it.layout.buildDirectory.dir("libs") }) {
        include "*.jar"
    }

    into layout.projectDirectory.dir("output")
}

tasks.named("build") {
    finalizedBy("copyAllJars")
}