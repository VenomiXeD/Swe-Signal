name: Release
on:
  push:
    branches: [ "create-6.0.0" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "create-6.0.0" ]

jobs:
  release:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make Gradle executable
        run: chmod +x ./gradlew

      - name: Build
        run: ./gradlew build

      - name: Collect jars
        run: |
          mkdir -p artifacts
          find . -path "*/build/libs/*.jar" \
            ! -name "*-sources.jar" \
            ! -name "*-javadoc.jar" \
            -exec cp {} artifacts/ \;

      - name: Create Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" artifacts/*.jar \
            --title "${GITHUB_REF_NAME}" \
            --notes "Automated release"